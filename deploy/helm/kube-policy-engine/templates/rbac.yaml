apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kube-policy-engine.fullname" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kube-policy-engine.fullname" . }}
rules:
  - apiGroups: ["policy.k8spe.io"]
    resources: ["policies"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kube-policy-engine.fullname" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kube-policy-engine.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kube-policy-engine.fullname" . }}
    namespace: {{ .Release.Namespace }}
