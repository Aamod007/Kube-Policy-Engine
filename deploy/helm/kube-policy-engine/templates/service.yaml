apiVersion: v1
kind: Service
metadata:
  name: {{ include "kube-policy-engine.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "kube-policy-engine.name" . }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: webhook
      protocol: TCP
      name: webhook
    - port: {{ .Values.service.metricsPort }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    app.kubernetes.io/name: {{ include "kube-policy-engine.name" . }}
